spring.application.name=GymHub
server.port=8080

# Database Configuration (XAMPP MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gym_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration (for Phase 2 onwards)
jwt.secret=${JWT_SECRET:GymHubSuperSecretKeyForJwtAuthenticationWhichMustBeAtLeast256BitsLong2026!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
