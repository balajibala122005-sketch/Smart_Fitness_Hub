spring.application.name=gymhub-test
server.port=8080

# Isolated in-memory test database with MySQL mode
spring.datasource.url=jdbc:h2:mem:gym_hub_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT Secret
jwt.secret=GymHubSuperSecretKeyForJwtAuthenticationWhichMustBeAtLeast256BitsLong2026!
jwt.expiration-ms=86400000
