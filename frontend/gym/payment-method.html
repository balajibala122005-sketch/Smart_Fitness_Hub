<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Method</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{ box-sizing:border-box; }

body{
    margin:0;
    font-family:'Poppins',sans-serif;

    background:
        linear-gradient(rgba(0,0,0,.8),rgba(0,0,0,.9)),
        url('hi.jpg') no-repeat center center fixed;
    background-size:cover;

    color:#fff;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    opacity:0;
    animation:fadeIn 1.2s ease forwards;
}

@keyframes fadeIn{
    to{ opacity:1; }
}

/* GLASS BOX */
.box{
    width:320px;
    padding:40px 30px;
    border-radius:26px;
    text-align:center;

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);

    border:1px solid rgba(0,246,255,0.25);

    box-shadow:
        0 0 30px rgba(0,0,0,.7),
        inset 0 0 15px rgba(255,255,255,.05);

    animation:slideUp .9s ease forwards;
}

@keyframes slideUp{
    from{ transform:translateY(35px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
}

/* TITLE */
h2{
    margin-bottom:30px;
    letter-spacing:2px;
    color:#00f6ff;
    text-shadow:
        0 0 12px #00f6ff,
        0 0 30px rgba(0,246,255,.6);

    animation:titleFloat 3s ease-in-out infinite;
}

@keyframes titleFloat{
    50%{ transform:translateY(-6px); }
}

/* BUTTONS */
button{
    width:100%;
    padding:16px;
    margin:12px 0;

    border:none;
    border-radius:16px;
    cursor:pointer;

    font-size:1em;
    font-weight:700;
    letter-spacing:1px;

    transition:.35s ease;
}

/* PHONEPE */
.phonepe{
    background:linear-gradient(135deg,#5f259f,#7e3ff2);
    color:#fff;
    box-shadow:0 0 20px rgba(126,63,242,.6);
}

.phonepe:hover{
    transform:scale(1.08);
    box-shadow:0 0 40px rgba(126,63,242,1);
}

/* GPAY */
.gpay{
    background:linear-gradient(135deg,#1a73e8,#3ea6ff);
    color:#fff;
    box-shadow:0 0 20px rgba(26,115,232,.6);
}

.gpay:hover{
    transform:scale(1.08);
    box-shadow:0 0 40px rgba(26,115,232,1);
}

/* COD */
.cod{
    background:linear-gradient(135deg,#00f6ff,#00bcd4);
    color:#000;
    box-shadow:0 0 20px rgba(0,246,255,.6);
}

.cod:hover{
    transform:scale(1.08);
    box-shadow:0 0 40px rgba(0,246,255,1);
}

/* RESPONSIVE */
@media(max-width:480px){
    .box{
        width:90%;
    }
}
</style>
</head>

<body>

<div class="box">
    <h2>Select Payment</h2>

    <button class="phonepe" onclick="pay()">PhonePe</button>
    <button class="gpay" onclick="pay()">Google Pay</button>
    <button class="cod" onclick="cod()">Cash On Delivery</button>
</div>

<script>
function pay(){
    window.location.href = "upi-processing.html";
}

function cod(){
    window.location.href = "order-success.html";
}
</script>

</body>
</html>
