<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Web App - Diet & Nutrition Management</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), url('hi.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    display: flex;
    justify-content: center;
    padding: 40px 0;
    min-height: 100vh;
    opacity: 0;
    transition: opacity 1.2s ease;
}
body.loaded { opacity: 1; }

.container-diet {
    width: 90%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: slideUp 1s ease forwards;
}

@keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.module-title {
    font-size: 2.6em;
    letter-spacing: 2.5px;
    color: #00f6ff;
    text-shadow: 0 0 12px #00f6ff, 0 0 35px rgba(0,246,255,0.6);
    margin-bottom: 25px;
    text-align: center;
    text-transform: uppercase;
}

.section {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    width: 100%;
    margin-bottom: 25px;
    border-radius: 22px;
    padding: 30px;
    border: 1px solid rgba(0,246,255,0.25);
    box-shadow: 0 0 35px rgba(0,0,0,0.7);
    text-align: left;
}

h2 {
    color: #ff00ff;
    font-size: 1.4em;
    margin-top: 0;
    margin-bottom: 18px;
    text-shadow: 0 0 10px rgba(255,0,255,0.5);
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* FORM GRID */
.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 14px;
}

.form-grid input, .form-grid select, .calc-input {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.35);
    color: #fff;
    font-size: 0.95em;
    font-family: 'Poppins', sans-serif;
    transition: 0.3s;
}

.form-grid select option {
    background: #111;
    color: #fff;
}

.form-grid input:focus, .form-grid select:focus, .calc-input:focus {
    outline: none;
    border-color: #00f6ff;
    box-shadow: 0 0 15px rgba(0,246,255,0.4);
}

.btn-center {
    text-align: center;
    margin-top: 15px;
}

button {
    padding: 13px 26px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #00f6ff, #00bcd4);
    color: #000;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: 'Poppins', sans-serif;
}

button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 0 20px #00f6ff;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* STATS CHIPS */
.stats-banner {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.stat-chip {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(0, 246, 255, 0.25);
    border-radius: 16px;
    padding: 15px;
    text-align: center;
    transition: 0.3s;
}

.stat-chip:hover {
    border-color: #00f6ff;
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0, 246, 255, 0.2);
}

.stat-chip-label {
    display: block;
    font-size: 0.72em;
    color: #ff00ff;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 700;
}

.stat-chip-val {
    display: block;
    font-size: 1.35em;
    color: #00f6ff;
    font-weight: 800;
    margin-top: 4px;
}

/* MEAL CARDS */
.meal-item {
    background: rgba(255,255,255,0.04);
    border-left: 4px solid #00f6ff;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 12px;
    transition: 0.3s;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.meal-item:hover {
    background: rgba(255,255,255,0.08);
    border-left-color: #ff00ff;
    transform: translateX(4px);
}

.meal-type-badge {
    display: inline-block;
    padding: 3px 9px;
    font-size: 0.72em;
    font-weight: 700;
    text-transform: uppercase;
    border-radius: 6px;
    background: rgba(0, 246, 255, 0.15);
    color: #00f6ff;
    border: 1px solid rgba(0, 246, 255, 0.4);
    margin-left: 8px;
    vertical-align: middle;
}

.btn-delete {
    padding: 6px 14px;
    font-size: 0.75em;
    background: transparent;
    color: #ff0055;
    border: 1px solid #ff0055;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
}

.btn-delete:hover:not(:disabled) {
    background: #ff0055;
    color: #fff;
    box-shadow: 0 0 12px #ff0055;
}

ul { list-style: none; padding: 0; margin: 0; }
li { background: rgba(255,255,255,0.05); margin: 8px 0; padding: 12px; border-radius: 8px; border-left: 4px solid #00f6ff; }

/* LOADER */
#loader {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, #0f2027, #000);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}
.loader-ring {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 6px solid rgba(255,255,255,0.1);
    border-top: 6px solid #00f6ff;
    animation: spin 1s linear infinite;
    box-shadow: 0 0 38px #00f6ff;
}
@keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loader">
  <div class="loader-ring"></div>
  <h3 style="margin-top: 20px; color:#00f6ff; letter-spacing: 3px;">GYM HUB</h3>
  <p style="color:#ff00ff; letter-spacing: 2px; text-transform: uppercase;">Diet & Nutrition</p>
</div>

<div class="container-diet">
    <div style="text-align: left; margin-bottom: 20px; width: 100%;">
        <a href="dashboard.html" style="display: inline-block; color: #00f6ff; text-decoration: none; font-size: 0.9em; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; border: 1px solid rgba(0,246,255,0.3); padding: 8px 16px; border-radius: 12px; background: rgba(0,246,255,0.05); transition: 0.3s;">&larr; Command Dashboard</a>
    </div>

    <h1 class="module-title">Diet & Nutrition</h1>

    <!-- DAILY NUTRITION TOTALS SECTION -->
    <div class="section">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 18px;">
            <h2 style="margin: 0;">Daily Nutrition Summary</h2>
            <div style="display: flex; align-items: center; gap: 8px;">
                <label for="filter-date" style="font-size: 0.85em; color: #00f6ff; font-weight: 600;">DATE:</label>
                <input type="date" id="filter-date" style="padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(0,246,255,0.3); background: rgba(0,0,0,0.4); color: #fff; font-family: 'Poppins';" onchange="changeSummaryDate()">
            </div>
        </div>

        <div class="stats-banner" id="nutrition-stats-banner">
            <div class="stat-chip">
                <span class="stat-chip-label">CALORIES</span>
                <span class="stat-chip-val" id="summary-calories">0 kcal</span>
            </div>
            <div class="stat-chip">
                <span class="stat-chip-label">PROTEIN</span>
                <span class="stat-chip-val" id="summary-protein">0 g</span>
            </div>
            <div class="stat-chip">
                <span class="stat-chip-label">CARBS</span>
                <span class="stat-chip-val" id="summary-carbs">0 g</span>
            </div>
            <div class="stat-chip">
                <span class="stat-chip-label">FATS</span>
                <span class="stat-chip-val" id="summary-fats">0 g</span>
            </div>
            <div class="stat-chip">
                <span class="stat-chip-label">MEALS</span>
                <span class="stat-chip-val" id="summary-meals">0</span>
            </div>
        </div>
        <div id="target-calories-info" style="font-size: 0.85em; color: #888; font-style: italic; text-align: right;"></div>
    </div>

    <!-- LOG MEAL SECTION -->
    <div class="section">
        <h2>Record Meal / Nutrition</h2>
        <div class="form-grid">
            <input type="text" id="meal-name" placeholder="Meal Name (e.g., Grilled Chicken & Brown Rice) *" required>
            <select id="meal-type-select">
                <option value="breakfast">Breakfast</option>
                <option value="lunch" selected>Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="snack">Snack</option>
            </select>
            <input type="number" id="meal-calories" placeholder="Calories (kcal) *" min="0" max="10000" required>
            <input type="number" id="meal-protein" placeholder="Protein (g)" step="0.1" min="0" max="1000">
            <input type="number" id="meal-carbs" placeholder="Carbohydrates (g)" step="0.1" min="0" max="1000">
            <input type="number" id="meal-fats" placeholder="Fats (g)" step="0.1" min="0" max="1000">
            <input type="date" id="meal-date" placeholder="Meal Date">
        </div>
        <div class="form-grid" style="grid-template-columns: 1fr;">
            <input type="text" id="meal-notes" placeholder="Optional Notes (e.g., Post-workout meal, extra veggies)" maxlength="500">
        </div>
        <div class="btn-center">
            <button id="btn-log-meal" onclick="logMeal()">Log Meal</button>
            <div id="meal-msg" style="margin-top: 14px; font-weight: 600; min-height: 20px; text-align: center;"></div>
        </div>
    </div>

    <!-- MEAL HISTORY SECTION -->
    <div class="section">
        <h2 id="history-title">Logged Meals</h2>
        <div id="meal-list"></div>
    </div>

    <!-- BMI & ENERGY TARGET CALCULATOR -->
    <div class="section">
        <h2>BMI & Energy Target Calculator</h2>
        <div class="form-grid">
            <input type="number" id="calc-height" class="calc-input" placeholder="Height (cm)">
            <input type="number" id="calc-weight" class="calc-input" placeholder="Weight (kg)">
        </div>
        <div class="btn-center">
            <button onclick="calculateBMI()">Calculate</button>
        </div>
        <div id="bmi-result" style="margin-top: 15px; font-weight: 600; text-align: center;"></div>
    </div>

    <!-- DIET PROTOCOLS & MEAL OPTIONS -->
    <div class="section">
        <h2>Diet Protocols</h2>
        <div class="form-grid">
            <select id="goal" class="calc-input">
                <option value="">Select Protocol</option>
                <option value="weight_loss">The Shred (Fat Loss Protocol)</option>
                <option value="muscle_gain">The Titan (Hypertrophy Fuel)</option>
            </select>
        </div>
        <div class="btn-center">
            <button onclick="showDietPlan()">Get Protocol</button>
        </div>
        <div id="diet-result" style="margin-top: 15px;"></div>
    </div>

    <!-- MEAL SUGGESTIONS -->
    <div class="section">
        <h2>Nutrition Suggestions</h2>
        <div class="form-grid">
            <select id="suggestion-pref" class="calc-input">
                <option value="">Select Diet Preference</option>
                <option value="veg">Plant Powered (Vegetarian)</option>
                <option value="non-veg">Pro-Protein (Omnivore / Non-Veg)</option>
            </select>
        </div>
        <div class="btn-center">
            <button onclick="showMeals()">View Options</button>
        </div>
        <div id="meal-result" style="margin-top: 15px;"></div>
    </div>

    <!-- WATER INTAKE TRACKER -->
    <div class="section">
        <h2>Hydration Tracker</h2>
        <div class="form-grid">
            <input type="number" id="water" class="calc-input" placeholder="Glasses of Water" min="1" max="50">
        </div>
        <div class="btn-center">
            <button onclick="trackWater()">Track Hydration</button>
        </div>
        <div id="water-result" style="margin-top: 15px; text-align: center; font-weight: 600;"></div>
    </div>
</div>

<script src="script.js"></script>
<script>
// Authentication check on load
if (!window.GymApi || !GymApi.isAuthenticated()) {
    window.location.href = 'index.html';
}

const todayStr = new Date().toISOString().split('T')[0];
document.getElementById('filter-date').value = todayStr;
document.getElementById('filter-date').max = todayStr;
document.getElementById('meal-date').value = todayStr;
document.getElementById('meal-date').max = todayStr;

let currentSelectedDate = todayStr;
let currentMeals = [];

// Pre-fill BMI calculator from user profile if available
const currentUser = GymApi.getUser();
if (currentUser) {
    if (currentUser.height) document.getElementById('calc-height').value = currentUser.height;
    if (currentUser.weight) document.getElementById('calc-weight').value = currentUser.weight;
}

async function loadNutritionData(date = todayStr) {
    currentSelectedDate = date;
    const historyTitle = document.getElementById('history-title');
    historyTitle.textContent = date === todayStr ? "Today's Logged Meals" : `Logged Meals for ${date}`;

    // Load Daily Summary
    try {
        const summary = await GymApi.getDailyNutritionSummary(date);
        if (summary) {
            document.getElementById('summary-calories').textContent = `${summary.totalCalories} kcal`;
            document.getElementById('summary-protein').textContent = `${summary.totalProtein} g`;
            document.getElementById('summary-carbs').textContent = `${summary.totalCarbohydrates} g`;
            document.getElementById('summary-fats').textContent = `${summary.totalFats} g`;
            document.getElementById('summary-meals').textContent = summary.mealCount;

            const targetInfo = document.getElementById('target-calories-info');
            if (summary.targetCalories) {
                targetInfo.textContent = `Daily Target: ${summary.targetCalories} kcal (Remaining: ${Math.max(0, summary.targetCalories - summary.totalCalories)} kcal)`;
            } else {
                targetInfo.textContent = '';
            }
        }
    } catch (err) {
        console.error('Failed to load nutrition summary:', err);
    }

    // Load Meals for Date
    try {
        const meals = await GymApi.getMeals(date);
        if (Array.isArray(meals)) {
            currentMeals = meals;
            displayMealList();
        }
    } catch (err) {
        console.error('Failed to load meals:', err);
        document.getElementById('meal-list').innerHTML = `<p style="color: #ff0055;">Unable to load meals: ${err.message || 'Server error'}</p>`;
    }
}

function displayMealList() {
    const container = document.getElementById('meal-list');
    if (!currentMeals || currentMeals.length === 0) {
        container.innerHTML = '<div style="color: #888; font-style: italic; text-align: center; margin: 20px 0; padding: 20px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px dashed rgba(255,255,255,0.1);">No meals logged for this date. Record your nutrition above!</div>';
        return;
    }

    let html = '<div>';
    currentMeals.forEach(meal => {
        const typeBadge = `<span class="meal-type-badge">${meal.mealType}</span>`;
        const notesStr = meal.notes ? `<div style="margin-top: 4px; color: #999; font-size: 0.85em; font-style: italic;">Notes: ${meal.notes}</div>` : '';

        html += `
        <div class="meal-item" id="meal-row-${meal.id}">
            <div style="flex: 1 1 280px;">
                <div style="font-size: 1.05em; font-weight: 700; color: #fff;">
                    ${meal.mealName} ${typeBadge}
                </div>
                <div style="margin-top: 4px; color: #bbb; font-size: 0.9em;">
                    <strong style="color: #ff00ff;">${meal.calories} kcal</strong> &bull;
                    Protein: <span style="color: #00f6ff;">${meal.protein}g</span> |
                    Carbs: <span style="color: #00f6ff;">${meal.carbohydrates}g</span> |
                    Fats: <span style="color: #00f6ff;">${meal.fats}g</span>
                </div>
                ${notesStr}
            </div>
            <button class="btn-delete" onclick="deleteMealItem(${meal.id})">✕ Delete</button>
        </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
}

function changeSummaryDate() {
    const selected = document.getElementById('filter-date').value || todayStr;
    loadNutritionData(selected);
}

async function logMeal() {
    const nameInput = document.getElementById('meal-name');
    const typeSelect = document.getElementById('meal-type-select');
    const caloriesInput = document.getElementById('meal-calories');
    const proteinInput = document.getElementById('meal-protein');
    const carbsInput = document.getElementById('meal-carbs');
    const fatsInput = document.getElementById('meal-fats');
    const dateInput = document.getElementById('meal-date');
    const notesInput = document.getElementById('meal-notes');
    const msgDiv = document.getElementById('meal-msg');
    const btn = document.getElementById('btn-log-meal');

    const mealName = nameInput.value.trim();
    const mealType = typeSelect.value;
    const calories = caloriesInput.value ? parseInt(caloriesInput.value, 10) : null;
    const protein = proteinInput.value ? parseFloat(proteinInput.value) : 0.0;
    const carbohydrates = carbsInput.value ? parseFloat(carbsInput.value) : 0.0;
    const fats = fatsInput.value ? parseFloat(fatsInput.value) : 0.0;
    const mealDate = dateInput.value || todayStr;
    const notes = notesInput.value.trim() || null;

    msgDiv.textContent = '';

    // Validation
    if (!mealName) {
        msgDiv.style.color = '#ff0055';
        msgDiv.textContent = '[ERROR]: Meal name is required.';
        return;
    }
    if (calories === null || isNaN(calories) || calories < 0 || calories > 10000) {
        msgDiv.style.color = '#ff0055';
        msgDiv.textContent = '[ERROR]: Calories must be a valid number between 0 and 10000 kcal.';
        return;
    }
    if (isNaN(protein) || protein < 0 || protein > 1000) {
        msgDiv.style.color = '#ff0055';
        msgDiv.textContent = '[ERROR]: Protein must be between 0 and 1000 grams.';
        return;
    }
    if (isNaN(carbohydrates) || carbohydrates < 0 || carbohydrates > 1000) {
        msgDiv.style.color = '#ff0055';
        msgDiv.textContent = '[ERROR]: Carbohydrates must be between 0 and 1000 grams.';
        return;
    }
    if (isNaN(fats) || fats < 0 || fats > 1000) {
        msgDiv.style.color = '#ff0055';
        msgDiv.textContent = '[ERROR]: Fats must be between 0 and 1000 grams.';
        return;
    }
    if (mealDate > todayStr) {
        msgDiv.style.color = '#ff0055';
        msgDiv.textContent = '[ERROR]: Meal date cannot be in the future.';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Recording...';

    try {
        const payload = {
            mealName,
            mealType,
            calories,
            protein,
            carbohydrates,
            fats,
            mealDate,
            notes
        };

        const saved = await GymApi.logMeal(payload);
        if (saved) {
            msgDiv.style.color = '#00f6ff';
            msgDiv.textContent = `[SYSTEM]: Meal "${saved.mealName}" (${saved.mealType}) logged successfully!`;

            nameInput.value = '';
            caloriesInput.value = '';
            proteinInput.value = '';
            carbsInput.value = '';
            fatsInput.value = '';
            notesInput.value = '';

            // Update date filter to meal date and reload summary & list
            document.getElementById('filter-date').value = mealDate;
            await loadNutritionData(mealDate);

            setTimeout(() => { msgDiv.textContent = ''; }, 4000);
        }
    } catch (err) {
        msgDiv.style.color = '#ff0055';
        msgDiv.textContent = `[ERROR]: ${err.message || 'Failed to log meal'}`;
    } finally {
        btn.disabled = false;
        btn.textContent = 'Log Meal';
    }
}

async function deleteMealItem(mealId) {
    if (!confirm('Are you sure you want to delete this meal record?')) {
        return;
    }

    const row = document.getElementById(`meal-row-${mealId}`);
    const deleteBtn = row ? row.querySelector('.btn-delete') : null;
    if (deleteBtn) {
        deleteBtn.disabled = true;
        deleteBtn.textContent = 'Deleting...';
    }

    try {
        await GymApi.deleteMeal(mealId);
        // Refresh summary and meals list
        await loadNutritionData(currentSelectedDate);
    } catch (err) {
        alert(`[ERROR]: Could not delete meal: ${err.message}`);
        if (deleteBtn) {
            deleteBtn.disabled = false;
            deleteBtn.textContent = '✕ Delete';
        }
    }
}

/* Offline Helper Calculators */
function calculateBMI() {
    const height = parseFloat(document.getElementById('calc-height').value);
    const weight = parseFloat(document.getElementById('calc-weight').value);
    if (!height || !weight || height <= 0 || weight <= 0) {
        alert('Please input positive values for height and weight');
        return;
    }

    const bmi = (weight / ((height/100) ** 2)).toFixed(1);
    let status = '';
    if(bmi < 18.5) status = 'Under Threshold';
    else if(bmi < 24.9) status = 'Optimal Condition';
    else if(bmi < 29.9) status = 'Above Baseline';
    else status = 'Critical Mass';

    const calories = Math.round(weight * 30);
    document.getElementById('bmi-result').innerHTML =
        `Status: <span style="color:#00f6ff">${status}</span> (BMI: ${bmi})<br>Daily Energy Target: <span style="color:#ff00ff">${calories} kcal</span>`;
}

function showDietPlan() {
    const goal = document.getElementById('goal').value;
    let plan = '';
    if (goal === 'weight_loss') {
        plan = `<ul>
            <li><strong>Morning:</strong> Power Oats, Whey Protein & Antioxidant Berries (400 kcal)</li>
            <li><strong>Midday:</strong> Grilled Chicken / Tofu, Brown Rice & Broccoli (550 kcal)</li>
            <li><strong>Evening Snack:</strong> Greek Yogurt & Almonds (200 kcal)</li>
            <li><strong>Night:</strong> Lean Fish / Lentil Stew & Spinach Salad (450 kcal)</li>
        </ul>`;
    } else if (goal === 'muscle_gain') {
        plan = `<ul>
            <li><strong>Morning:</strong> 4 Whole Eggs, Whole Grain Toast & Peanut Butter (650 kcal)</li>
            <li><strong>Midday:</strong> Titan Chicken / Paneer, Quinoa & Sweet Potatoes (800 kcal)</li>
            <li><strong>Pre/Post-Workout:</strong> Whey Protein Shake & Banana (350 kcal)</li>
            <li><strong>Night:</strong> Salmon / Black Bean Chilli & Avocado Salad (700 kcal)</li>
        </ul>`;
    } else {
        alert('Select your training path first');
        return;
    }
    document.getElementById('diet-result').innerHTML = plan;
}

function showMeals() {
    const pref = document.getElementById('suggestion-pref').value;
    let meals = '';
    if (pref === 'veg') {
        meals = `<ul>
            <li><strong>Paneer Power Bowl:</strong> 200g Paneer, Quinoa, Mixed Peppers & Olive Oil &bull; 580 kcal (P: 32g, C: 45g, F: 28g)</li>
            <li><strong>Lentil Muscle Soup:</strong> Yellow Moong Dal, Spinach, Garlic & Toasted Multigrain Bread &bull; 420 kcal (P: 24g, C: 62g, F: 6g)</li>
            <li><strong>Tofu Stir-Fry:</strong> Crisp Tofu Cubes, Broccoli, Soy Sesame Glaze & Jasmine Rice &bull; 490 kcal (P: 28g, C: 54g, F: 18g)</li>
        </ul>`;
    } else if (pref === 'non-veg') {
        meals = `<ul>
            <li><strong>Blaze-Grilled Chicken:</strong> 250g Chicken Breast, Steamed Asparagus & Sweet Potato &bull; 520 kcal (P: 55g, C: 42g, F: 8g)</li>
            <li><strong>Omega Salmon Fillet:</strong> Pan-seared Salmon, Wild Rice & Lemon Garlic Zucchini &bull; 610 kcal (P: 42g, C: 38g, F: 26g)</li>
            <li><strong>Elite Egg Scramble:</strong> 3 Whole Eggs, 3 Egg Whites, Avocado & Sprouted Toast &bull; 460 kcal (P: 34g, C: 28g, F: 22g)</li>
        </ul>`;
    } else {
        alert('Select preference first');
        return;
    }
    document.getElementById('meal-result').innerHTML = meals;
}

function trackWater() {
    const water = parseInt(document.getElementById('water').value, 10);
    if (!water || water <= 0) {
        alert('Log a positive number of glasses');
        return;
    }
    document.getElementById('water-result').innerHTML =
        `System Update: <span style="color:#00f6ff">${water} glasses (~${(water * 0.25).toFixed(1)}L)</span> logged today. 💧 Stay hydrated!`;
}

// Initial load
loadNutritionData(todayStr);

window.addEventListener("load", () => {
    setTimeout(() => {
        const loader = document.getElementById("loader");
        if (loader) loader.style.display = "none";
        document.body.classList.add("loaded");
    }, 700);
});
</script>
