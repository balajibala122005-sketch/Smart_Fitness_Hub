<!DOCTYPE html>
<html>
<head>
<title>Payment Method</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<style>
body{
font-family:Poppins;
background:#000;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.box{
background:rgba(255,255,255,.08);
padding:35px;
border-radius:20px;
text-align:center;
width:300px;
}
button{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}
.phonepe{background:#5f259f;color:#fff;}
.gpay{background:#1a73e8;color:#fff;}
.cod{background:#00f6ff;color:#000;}
</style>
</head>
<body>

<div class="box">
<h2>Select Payment</h2>
<button class="phonepe" onclick="pay()">PhonePe</button>
<button class="gpay" onclick="pay()">Google Pay</button>
<button class="cod" onclick="cod()">Cash on Delivery</button>
</div>

<script>
function pay(){ window.location.href="upi-processing.html"; }
function cod(){ window.location.href="order-success.html"; }
</script>

</body>
</html>
